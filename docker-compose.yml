# Środowisko lokalne dla MP1 (wersja repozytorium MP2, oba motywy): WordPress + MariaDB w Dockerze.
# Uruchomienie:  docker compose up -d   ->  http://localhost:8080
# Hasła poniżej są wyłącznie laboratoryjne (środowisko lokalne, bez dostępu z internetu).
services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp_lab
      MARIADB_PASSWORD: lab-haslo-2026
      MARIADB_ROOT_PASSWORD: lab-root-2026
    volumes:
      - db_data:/var/lib/mysql

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp_lab
      WORDPRESS_DB_PASSWORD: lab-haslo-2026
    volumes:
      - wp_data:/var/www/html
      # motyw z katalogu projektu trafia do wp-content/themes
      - ./mojafirma:/var/www/html/wp-content/themes/mojafirma
      - ./mf-child:/var/www/html/wp-content/themes/mf-child

volumes:
  db_data:
  wp_data:
